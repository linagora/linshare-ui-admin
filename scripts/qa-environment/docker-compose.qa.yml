# The LinShare stack of the QA environment, after https://github.com/linagora/linshare-docker
# (no reverse proxy, ClamAV nor thumbnail server; Mailpit instead of a mail server).
# Run through build.sh, start.sh and stop.sh, which set the variables.

services:
  database:
    image: linagora/linshare-database:${LINSHARE_VERSION}
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: linshare
      POSTGRES_PASSWORD: linshare
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "linshare"]
      interval: 3s
      retries: 60

  mongodb:
    image: mongo:4.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: linshare
      MONGO_INITDB_ROOT_PASSWORD: linshare

  ldap:
    image: linagora/linshare-ldap-for-tests:2.0

  # Catches every mail of the backend: web UI on port 8025, SMTP on 1025
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - 127.0.0.1:${QA_MAIL_PORT}:8025

  backend:
    image: linagora/linshare-backend:${LINSHARE_VERSION}
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      SMTP_HOST: mail
      SMTP_PORT: 1025
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: linshare
      POSTGRES_PASSWORD: linshare
      MONGODB_DATA_REPLICA_SET: mongodb:27017
      MONGODB_SMALLFILES_REPLICA_SET: mongodb:27017
      MONGODB_USER: linshare
      MONGODB_PASSWORD: linshare
      THUMBNAIL_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "-o", "/dev/null", "http://localhost:8080/linshare/"]
      interval: 5s
      timeout: 5s
      retries: 120

  # Plain http: the session cookie must not be Secure
  ui-admin:
    image: ${QA_IMAGE_UI_ADMIN}
    depends_on: [backend]
    environment: &ui-env
      EXTERNAL_URL: admin.linshare.local
      TOMCAT_URL: backend
      TOMCAT_PORT: 8080
      LS_SECURE_COOKIE: "FALSE"
    ports:
      - 127.0.0.1:${QA_ADMIN_PORT}:80

  ui-user:
    image: ${QA_IMAGE_UI_USER}
    depends_on: [backend]
    environment:
      <<: *ui-env
      EXTERNAL_URL: user.linshare.local
    ports:
      - 127.0.0.1:${QA_USER_PORT}:80

  ui-upload-request:
    image: ${QA_IMAGE_UI_UPLOAD_REQUEST}
    depends_on: [backend]
    environment:
      <<: *ui-env
      EXTERNAL_URL: upload-request.linshare.local
    ports:
      - 127.0.0.1:${QA_UPLOAD_REQUEST_PORT}:80

  # One-shot, run by start.sh once the backend is up: the top domain top1 on the test LDAP, a
  # guest domain, guests and upload requests enabled, the URLs of the notifications
  init:
    image: linagora/linshare-init:${LINSHARE_VERSION}
    profiles: [init]
    environment:
      LS_SERVER_HOST: backend
      LS_SERVER_PORT: 8080
      LS_LDAP_NAME: ldap
      LS_LDAP_URL: ldap://ldap:1389
      LS_LDAP_BASE_DN: ou=People,dc=linshare,dc=org
      LS_LDAP_DN: cn=linshare,dc=linshare,dc=org
      LS_LDAP_PW: linshare
      LS_DOMAIN_PATTERN_NAME: pattern-demo
      LS_DOMAIN_PATTERN_MODEL: a4620dfc-dc46-11e8-a098-2355f9d6585a
      LS_USER_URL: http://user.linshare.local
      LS_EXTERNAL_URL: http://user.linshare.local
      LS_UPLOAD_REQUEST_URL: http://upload-request.linshare.local
